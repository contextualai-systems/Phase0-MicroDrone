name: CV CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'requirements-ci.txt'
      - 'tests/__init__.py'
      - 'INTEGRATION_README.md'
      - 'cv/**'
      - 'state_machine/**'
      - 'universal_log/**'
      - 'tests/test_computer_vision.py'
      - 'tests/test_cv*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'requirements-ci.txt'
      - 'tests/__init__.py'
      - 'INTEGRATION_README.md'
      - 'cv/**'
      - 'state_machine/**'
      - 'universal_log/**'
      - 'tests/test_computer_vision.py'
      - 'tests/test_cv*.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CV tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt -r cv/requirements.txt

      - name: CV interface
        if: ${{ !cancelled() }}
        run: python -B -m unittest discover -s tests -p 'test_computer_vision.py' -v

      - name: CV perception and benchmark
        if: ${{ !cancelled() }}
        run: python -B -m unittest discover -s tests -p 'test_cv*.py' -v
