name: Safety CI

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'requirements-ci.txt'
      - 'tests/__init__.py'
      - 'INTEGRATION_README.md'
      - 'safety_layer/**'
      - 'motion_engine/**'
      - 'tests/test_safety*.py'
      - 'tests/test_command_check.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'requirements-ci.txt'
      - 'tests/__init__.py'
      - 'INTEGRATION_README.md'
      - 'safety_layer/**'
      - 'motion_engine/**'
      - 'tests/test_safety*.py'
      - 'tests/test_command_check.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safety-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Safety tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Safety policy
        if: ${{ !cancelled() }}
        run: python -B -m unittest discover -s tests -p 'test_safety*.py' -v

      - name: Command checks
        if: ${{ !cancelled() }}
        run: python -B -m unittest discover -s tests -p 'test_command_check.py' -v

      - name: Motion adapter
        if: ${{ !cancelled() }}
        run: python -B -m pytest motion_engine/tests/test_safety_adapter.py -v
